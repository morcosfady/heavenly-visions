<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Heavenly Visions</title>
<meta name="theme-color" content="#f7ecdc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: phone-first app shell. Logo header, search, grade tiles, then a lesson list; lessons open in a bottom sheet. */
:root{
  --bg:#f7ecdc; --surface:#fffaf2; --ink:#2b2a3a; --muted:#6f6a73;
  --gold:#b9852b; --gold-soft:#f1dcb2; --sky:#2f8fc0; --sky-soft:#d9eef8; --line:#e8d9c1;
  --shadow:0 6px 18px rgba(120,85,30,.12);
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a2b; --surface:#1d2540; --ink:#f3ecdf; --muted:#a9a8b8; --gold:#e3b45c; --gold-soft:#3a3324;
  --sky:#7cc4ea; --sky-soft:#1f3550; --line:#2c3657; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a2b; --surface:#1d2540; --ink:#f3ecdf; --muted:#a9a8b8; --gold:#e3b45c; --gold-soft:#3a3324;
  --sky:#7cc4ea; --sky-soft:#1f3550; --line:#2c3657; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:12px}

header.top{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px}
header.top img{width:min(230px,62vw);height:auto}
.tag{font-weight:800;color:var(--muted);font-size:.9rem;letter-spacing:.04em}
.back{align-self:flex-start;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800}
.mini{display:flex;align-items:center;gap:12px}
.mini img{width:64px;height:auto}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--sky)}

h2{font-family:var(--display);font-size:1.2rem;margin:0;color:var(--gold);text-wrap:balance;letter-spacing:.02em}
.sec{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:20px;border:0;background:var(--surface);box-shadow:var(--shadow);min-height:108px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{font-size:1.7rem;line-height:1}
.tile .nm{font-family:var(--display);font-weight:700;font-size:1.05rem}
.tile .ct{font-size:.82rem;font-weight:800;color:var(--muted)}
.tile.soon{opacity:.62}
.tile::after{content:"";position:absolute;inset:auto 14px 0 14px;height:4px;border-radius:4px 4px 0 0;background:var(--c,var(--gold))}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--sky-soft),var(--gold-soft));display:grid;place-items:center;font-size:1.6rem}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;font-size:.72rem;font-weight:800;padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.row .t{font-weight:800;line-height:1.25;min-width:0}
.row .g{font-size:.8rem;color:var(--muted);font-weight:700;margin-top:3px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:700}

.note{background:var(--sky-soft);border-radius:18px;padding:14px 16px;font-weight:700}
.note a{color:var(--sky)}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.card b{display:block;margin-bottom:2px}
.card p{margin:0;color:var(--muted);font-weight:600}

/* lesson sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:min(720px,100%);max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.tile{transition:none}}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sheet h3{font-family:var(--display);margin:0;font-size:1.25rem;text-wrap:balance}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;font-weight:800;text-decoration:none;border:0}
.btn.yt{background:#e62117;color:#fff;grid-column:1/-1;font-size:1.05rem}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.close{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:30}
footer{text-align:center;color:var(--muted);font-size:.85rem;font-weight:700}
@media (max-width:420px){.row{grid-template-columns:112px 1fr}}
</style>
</head>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

const inSec=id=>V.filter(v=>v[3]===id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app");

function rowHTML(v,showSec){
  const s=sec(v[3]);
  return `<button class="row" data-v="${v[0]}">
    <span class="thumb">${s.ic}<img src="https://i.ytimg.com/vi/${v[0]}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><span class="dur">${v[2]}</span></span>
    <span style="min-width:0"><span class="t">${esc(v[1])}</span>${showSec?`<div class="g">${s.ic} ${s.name}</div>`:""}</span>
  </button>`;
}
function home(){
  app.innerHTML=`
  <header class="top"><img src="${LOGO}" alt="Heavenly Visions"><div class="tag">Sunday School lessons for every grade</div></header>
  <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Search lessons (e.g. St. Mary, Pentecost)" autocomplete="off"></label>
  <div id="results" class="list" hidden></div>
  <section class="sec" id="grades"><h2>Choose your class</h2><div class="grid">${SECTIONS.map(s=>{
    const n=inSec(s.id).length;
    return `<button class="tile ${n?"":"soon"}" style="--c:${s.c}" data-s="${s.id}"><span class="ic">${s.ic}</span><span class="nm">${s.name}</span><span class="ct">${n?n+" lesson"+(n>1?"s":""):"Coming soon"}</span></button>`}).join("")}
    <button class="tile" style="--c:var(--sky)" data-s="servants"><span class="ic">🙏</span><span class="nm">Servants</span><span class="ct">Tips & sharing</span></button>
  </div></section>
  <section class="sec"><h2>Newest lessons</h2><div class="list">${["BHKgrAQCs3A","gMAFxDCTzr8","ZDRMmShq1jg"].map(id=>rowHTML(V.find(v=>v[0]===id),true)).join("")}</div></section>
  <div class="note">🎮 Quizzes & games are coming soon!</div>
  <footer>All ${V.length} lessons play on the Heavenly Visions YouTube channel</footer>`;
  const q=document.getElementById("q"),res=document.getElementById("results"),gr=document.getElementById("grades");
  q.addEventListener("input",()=>{
    const t=q.value.trim().toLowerCase();
    if(!t){res.hidden=true;gr.hidden=false;return}
    const m=V.filter(v=>v[1].toLowerCase().includes(t)||sec(v[3]).name.toLowerCase().includes(t));
    res.innerHTML=m.length?m.map(v=>rowHTML(v,true)).join(""):`<div class="empty">No lessons match "${esc(q.value)}"</div>`;
    res.hidden=false;gr.hidden=true;
  });
}
function section(id){
  if(id==="servants")return servants();
  const s=sec(id); if(!s)return home();
  const vs=inSec(id);
  app.innerHTML=`<button class="back" data-home>← All classes</button>
  <div class="mini"><img src="${LOGO}" alt=""><div><h2 style="font-size:1.5rem">${s.ic} ${s.name}</h2><div class="tag">${vs.length?vs.length+" lesson"+(vs.length>1?"s":""):"Lessons coming soon"}</div></div></div>
  <div class="list">${vs.length?vs.map(v=>rowHTML(v,false)).join(""):`<div class="empty">📚 ${s.name} lessons are on the way.<br>Check back soon!</div>`}</div>`;
}
function servants(){
  app.innerHTML=`<button class="back" data-home>← All classes</button>
  <div class="mini"><img src="${LOGO}" alt=""><div><h2 style="font-size:1.5rem">🙏 Servants</h2><div class="tag">Using Heavenly Visions in class</div></div></div>
  <div class="cards">
    <div class="card"><b>📲 Share a lesson</b><p>Open any lesson and tap "Copy link" to send it to parents on WhatsApp.</p></div>
    <div class="card"><b>📺 Play it in class</b><p>Tap "Watch on YouTube" to cast it to the TV or projector.</p></div>
    <div class="card"><b>📌 Install the app</b><p>Android: browser menu, then "Add to Home screen". iPhone: Share button, then "Add to Home Screen".</p></div>
  </div>
  <a class="btn yt" href="${PLAYLIST}" target="_blank" rel="noopener">▶ All lessons playlist on YouTube</a>`;
}
function openLesson(id){
  const v=V.find(x=>x[0]===id); if(!v)return; const s=sec(v[3]);
  const yt=`https://www.youtube.com/watch?v=${id}`;
  const scrim=document.createElement("div"); scrim.className="scrim";
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(v[1])}">
    <button class="close" data-close>✕ Close</button>
    ${CAN_EMBED?`<div class="player"><iframe src="https://www.youtube.com/embed/${id}?rel=0&playsinline=1" title="${esc(v[1])}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
      :`<a class="thumb" href="${yt}" target="_blank" rel="noopener" style="font-size:3rem">${s.ic}<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" onerror="this.remove()"></a>`}
    <div><h3>${esc(v[1])}</h3><div class="tag">${s.ic} ${s.name} · ${v[2]}</div></div>
    <div class="btns">
      <a class="btn yt" href="${yt}" target="_blank" rel="noopener">▶ Watch on YouTube</a>
      <button class="btn alt" style="grid-column:1/-1" data-copy="${yt}">🔗 Copy link</button>
    </div></div>`;
  document.body.appendChild(scrim);
  scrim.addEventListener("click",e=>{if(e.target===scrim||e.target.closest("[data-close]"))scrim.remove()});
  scrim.querySelector(".close").focus();
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,1800)}
document.addEventListener("click",async e=>{
  const r=e.target.closest("[data-v]"); if(r)return openLesson(r.dataset.v);
  const s=e.target.closest("[data-s]"); if(s){location.hash=s.dataset.s;return}
  if(e.target.closest("[data-home]")){location.hash="home";return}
  const c=e.target.closest("[data-copy]");
  if(c){try{await navigator.clipboard.writeText(c.dataset.copy);toast("Link copied ✅")}catch{toast(c.dataset.copy)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelector(".scrim")?.remove()});
function route(){const h=location.hash.slice(1);document.querySelector(".scrim")?.remove();(h&&h!=="home")?section(h):home();window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
if(CAN_EMBED){
  const l=document.createElement("link");l.rel="manifest";l.href="manifest.json";document.head.appendChild(l);
  const a=document.createElement("link");a.rel="apple-touch-icon";a.href="icon-180.png";document.head.appendChild(a);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>

</body>
</html>
