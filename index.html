<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}body.sheet-open{overflow:hidden}body.sheet-open #tabbar,body.sheet-open #lmfab{opacity:0;pointer-events:none;visibility:hidden}.sheet:focus{outline:none}
</style>
<title>Heavenly Visions</title>
<meta name="description" content="Heavenly Visions: Coptic Orthodox Sunday School for every grade. Lesson videos, Bible, quizzes, games and Lumi, a friendly helper for kids.">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#0f1630">
<link rel="preload" as="image" href="logo.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@500;700;800;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@500;700;800;900&display=swap"></noscript>
<style>
/* Layout: phone-first app shell. Cinematic intro overlay, then a hub of five big doors; each section is its own screen. */
:root{
  --bg:#f7ecdc; --surface:#fffaf2; --ink:#2b2a3a; --muted:#6f6a73;
  --gold:#b9852b; --gold-soft:#f1dcb2; --sky:#2f8fc0; --sky-soft:#d9eef8; --line:#e8d9c1;
  --good:#2e9b5b; --bad:#d4553b;
  --shadow:0 6px 18px rgba(120,85,30,.12);
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a2b; --surface:#1d2540; --ink:#f3ecdf; --muted:#a9a8b8; --gold:#e3b45c; --gold-soft:#3a3324;
  --sky:#7cc4ea; --sky-soft:#1f3550; --line:#2c3657; --good:#5fd08f; --bad:#ff8a70; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a2b; --surface:#1d2540; --ink:#f3ecdf; --muted:#a9a8b8; --gold:#e3b45c; --gold-soft:#3a3324;
  --sky:#7cc4ea; --sky-soft:#1f3550; --line:#2c3657; --good:#5fd08f; --bad:#ff8a70; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:12px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:1.2rem;color:var(--gold);letter-spacing:.02em}
.tag{font-weight:800;color:var(--muted);font-size:.9rem}
.sec{display:flex;flex-direction:column;gap:12px}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 45%,#22305e 0%,#0f1630 55%,#070b1a 100%);overflow:hidden;display:grid;place-items:center}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro-logo{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;animation:inlogo0 .9s .1s cubic-bezier(.2,.8,.2,1) both}@keyframes inlogo0{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.intro-logo.show{opacity:1;transform:scale(1)}
.intro-logo img{width:min(64vmin,300px);height:auto;filter:drop-shadow(0 0 28px rgba(255,220,140,.85))}
.intro-logo p{margin:0;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;color:#ffe7a8;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.skip,.snd{position:absolute;z-index:3;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;backdrop-filter:blur(4px)}
.skip{right:16px;top:calc(14px + env(safe-area-inset-top,0px))}
.snd{left:16px;top:calc(14px + env(safe-area-inset-top,0px))}
#intro.out{animation:out .6s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(1.04)}}

/* ---------- hub ---------- */
.hubhead{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.hubhead img{width:min(200px,54vw);height:auto}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{position:relative;overflow:hidden;border:0;border-radius:26px;padding:18px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:2px;text-align:left;color:#fff;box-shadow:var(--shadow);transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door:active{transform:scale(.98)}
.door .big{position:absolute;right:12px;top:12px;font-size:4.6rem;line-height:1;opacity:.95;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.door b{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.door small{font-weight:800;opacity:.92}
.door.wide{grid-column:1/-1;min-height:120px}
.contbtn{min-height:52px;text-align:left}
.privlink{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 16px;margin-top:4px}
.d-media{background:linear-gradient(140deg,#2f8fc0,#1d5f8f)}
.d-att{background:linear-gradient(140deg,#3fae6a,#1f7a48)}
.d-games{background:linear-gradient(140deg,#e8794a,#c24d2c)}
.d-quiz{background:linear-gradient(140deg,#8e6bd1,#5d3fa3)}
.d-bible{background:linear-gradient(140deg,#c99a3c,#8a5f1c)}
.verse{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);font-weight:700}
.verse cite{display:block;font-style:normal;color:var(--gold);font-weight:900;margin-top:4px;font-size:.9rem}

/* ---------- shared ---------- */
.topbar{display:flex;align-items:center;gap:10px}
.back{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800}
.title-row{display:flex;align-items:center;gap:10px}
.title-row h1{font-size:1.5rem}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;font-weight:900;text-decoration:none;border:0;background:var(--sky);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.yt{background:#e62117;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--sky);outline:none}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:700}
.note{background:var(--sky-soft);border-radius:18px;padding:14px 16px;font-weight:700}

/* media */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.search input{flex:1;min-width:0;min-height:44px;border:0;background:transparent;outline:none}
.search:focus-within{border-color:var(--sky)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:20px;border:0;background:var(--surface);box-shadow:var(--shadow);min-height:108px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{font-size:1.7rem;line-height:1}
.tile .nm{font-family:var(--display);font-weight:700;font-size:1.05rem}
.tile .ct{font-size:.82rem;font-weight:800;color:var(--muted)}
.tile.soon{opacity:.62}
.tile::after{content:"";position:absolute;inset:auto 14px 0 14px;height:4px;border-radius:4px 4px 0 0;background:var(--c,var(--gold))}
.list{display:flex;flex-direction:column;gap:10px}
.soonpic{background:linear-gradient(135deg,#2a3560,#4a3a78);color:#fff;text-align:center;font-size:1.5rem}.soonpic small{display:block;font-size:.62rem;font-weight:800;opacity:.85}.vcard{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#2a3560,#4a3a78);box-shadow:0 8px 24px rgba(0,0,0,.4);color:#fff;text-align:left;cursor:pointer}.vcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0) 55%)}.vplay{position:absolute;z-index:2;left:50%;top:44%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:var(--gold,#e3b45c);color:#3a2a00;display:grid;place-items:center;font-size:1.7rem;padding-left:5px;box-shadow:0 0 0 0 rgba(227,180,92,.7);animation:vpulse 1.8s infinite}.vcard:active .vplay{transform:translate(-50%,-50%) scale(.92)}@keyframes vpulse{70%{box-shadow:0 0 0 18px rgba(227,180,92,0)}100%{box-shadow:0 0 0 0 rgba(227,180,92,0)}}.vdur{position:absolute;z-index:2;right:12px;top:12px;background:rgba(0,0,0,.7);padding:3px 9px;border-radius:10px;font-size:.8rem;font-weight:800}.vlab{position:absolute;z-index:2;left:14px;right:14px;bottom:12px}.vlab b{display:block;font-family:var(--display);font-size:1.25rem}.vlab small{font-size:.85rem;font-weight:700;opacity:.9}.vcard.soon{display:grid;place-items:center}.vcard.soon::after{display:none}.vsoon{font-size:3.2rem;opacity:.9}.vcard.soon .vlab{text-align:center;left:0;right:0}a.door{text-decoration:none;color:inherit}.chip{padding:10px 14px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);color:inherit;font:inherit;font-weight:800;margin:4px}.door.locked{opacity:.6}.lessonbtn{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:0;border-radius:16px;padding:14px;box-shadow:var(--shadow);color:inherit;font:inherit;font-weight:700}.lessonbtn b{flex:none;min-width:2.4em;color:var(--gold)}.lessonbtn span{flex:1;min-width:0}.lessonbtn i{font-style:normal}
.row.soonrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;min-height:56px}.row.soonrow small{color:var(--muted);font-weight:800}.soontoggle{align-self:center;margin-top:6px;min-height:48px}
.row{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--sky-soft),var(--gold-soft));display:grid;place-items:center;font-size:1.6rem}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;font-size:.72rem;font-weight:800;padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.row .t{font-weight:800;line-height:1.25;min-width:0}
.row .g{font-size:.8rem;color:var(--muted);font-weight:700;margin-top:3px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:2500;overscroll-behavior:contain}
.sheet{width:min(720px,100%);max-height:92dvh;overscroll-behavior:contain;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.close{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800}
.btns{display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:2600}

/* attendance */
.here{width:100%;min-height:150px;border-radius:28px;border:0;background:linear-gradient(140deg,#3fae6a,#1f7a48);color:#fff;font-family:var(--display);font-size:1.6rem;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.here small{font-family:var(--body);font-weight:800;font-size:.95rem;opacity:.9}
.here.done{background:linear-gradient(140deg,#c99a3c,#8a5f1c)}
.codebox{letter-spacing:.5em;text-align:center;font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;padding-left:.5em!important}
.bigcode{font-size:3.6rem;font-weight:900;letter-spacing:.25em;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.hist{display:flex;flex-wrap:wrap;gap:8px}
.hist span{background:var(--gold-soft);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-weight:800}
.ok{color:var(--good);font-weight:900}

/* quiz */
.qcard{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.qprog{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.q{font-size:1.2rem;font-weight:900}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;text-align:left;font-weight:800}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.stars{font-size:2.6rem;text-align:center;letter-spacing:.1em}
.qlist .tile{min-height:96px}

/* games */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:3/4;max-width:100%;border:0;border-radius:16px;background:linear-gradient(140deg,var(--sky),#1d5f8f);color:#fff;font-size:2rem;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .25s}
.mc.open,.mc.got{background:var(--surface);color:var(--ink);transform:rotateY(180deg)}
.mc .f{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;line-height:1}
.mc .f small{font-size:.62rem;font-weight:900;margin-top:4px}
.mc.got{outline:3px solid var(--good)}
.stat{display:flex;justify-content:space-between;font-weight:900;font-variant-numeric:tabular-nums}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lt{width:48px;height:56px;border-radius:12px;border:0;background:var(--gold);color:#fff;font-size:1.5rem;font-weight:900;box-shadow:var(--shadow)}
.lt:disabled{opacity:.25}
.answer{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;border:2px dashed var(--line);border-radius:16px;padding:8px}
.answer span{width:40px;height:48px;border-radius:10px;background:var(--sky-soft);display:grid;place-items:center;font-size:1.3rem;font-weight:900}

/* bible */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bk{border:0;background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;box-shadow:var(--shadow)}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.ch{border:0;background:var(--surface);border-radius:12px;padding:12px 0;font-weight:900;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px;font-weight:900}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2b1d05}
.reader{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);font-size:var(--fs,1.08rem);line-height:1.7;max-width:70ch}
.reader sup{color:var(--gold);font-weight:900;margin-right:4px;font-size:.7em}
.navrow{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.navrow .btn{flex:1;min-width:120px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:2800}
footer{text-align:center;color:var(--muted);font-size:.85rem;font-weight:700}
.workshop{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;padding:12px 24px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.06em;color:#2b1d05;background:linear-gradient(135deg,#f6d27a,#e3b45c 50%,#b9852b);box-shadow:0 6px 18px rgba(227,180,92,.45),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .15s,box-shadow .15s}
.workshop:active{transform:scale(.96)}
.workshop::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:wshine 3.5s ease-in-out infinite}
@keyframes wshine{0%,60%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.workshop::after{animation:none}}
@media (max-width:420px){.row{grid-template-columns:112px 1fr}.door{min-height:132px}.door .big{font-size:3.3rem}}
@media (prefers-reduced-motion:reduce){*:not(#intro):not(#intro *){animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
