<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Heavenly Visions</title>
<meta name="theme-color" content="#0f1630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: phone-first app shell. Cinematic intro overlay, then a hub of five big doors; each section is its own screen. */
:root{
  --bg:#f7ecdc; --surface:#fffaf2; --ink:#2b2a3a; --muted:#6f6a73;
  --gold:#b9852b; --gold-soft:#f1dcb2; --sky:#2f8fc0; --sky-soft:#d9eef8; --line:#e8d9c1;
  --good:#2e9b5b; --bad:#d4553b;
  --shadow:0 6px 18px rgba(120,85,30,.12);
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a2b; --surface:#1d2540; --ink:#f3ecdf; --muted:#a9a8b8; --gold:#e3b45c; --gold-soft:#3a3324;
  --sky:#7cc4ea; --sky-soft:#1f3550; --line:#2c3657; --good:#5fd08f; --bad:#ff8a70; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a2b; --surface:#1d2540; --ink:#f3ecdf; --muted:#a9a8b8; --gold:#e3b45c; --gold-soft:#3a3324;
  --sky:#7cc4ea; --sky-soft:#1f3550; --line:#2c3657; --good:#5fd08f; --bad:#ff8a70; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:12px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:1.2rem;color:var(--gold);letter-spacing:.02em}
.tag{font-weight:800;color:var(--muted);font-size:.9rem}
.sec{display:flex;flex-direction:column;gap:12px}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 45%,#22305e 0%,#0f1630 55%,#070b1a 100%);overflow:hidden;display:grid;place-items:center}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro-logo{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transform:scale(.85);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.intro-logo.show{opacity:1;transform:scale(1)}
.intro-logo img{width:min(64vmin,300px);height:auto;filter:drop-shadow(0 0 28px rgba(255,220,140,.85))}
.intro-logo p{margin:0;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;color:#ffe7a8;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.skip,.snd{position:absolute;z-index:3;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;backdrop-filter:blur(4px)}
.skip{right:16px;top:calc(14px + env(safe-area-inset-top,0px))}
.snd{left:16px;top:calc(14px + env(safe-area-inset-top,0px))}
#intro.out{animation:out .6s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(1.04)}}

/* ---------- hub ---------- */
.hubhead{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.hubhead img{width:min(200px,54vw);height:auto}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{position:relative;overflow:hidden;border:0;border-radius:26px;padding:18px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:2px;text-align:left;color:#fff;box-shadow:var(--shadow);transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door:active{transform:scale(.98)}
.door .big{position:absolute;right:-6px;top:-8px;font-size:4.6rem;line-height:1;opacity:.95;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.door b{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.door small{font-weight:800;opacity:.92}
.door.wide{grid-column:1/-1;min-height:120px}
.d-media{background:linear-gradient(140deg,#2f8fc0,#1d5f8f)}
.d-att{background:linear-gradient(140deg,#3fae6a,#1f7a48)}
.d-games{background:linear-gradient(140deg,#e8794a,#c24d2c)}
.d-quiz{background:linear-gradient(140deg,#8e6bd1,#5d3fa3)}
.d-bible{background:linear-gradient(140deg,#c99a3c,#8a5f1c)}
.verse{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);font-weight:700}
.verse cite{display:block;font-style:normal;color:var(--gold);font-weight:900;margin-top:4px;font-size:.9rem}

/* ---------- shared ---------- */
.topbar{display:flex;align-items:center;gap:10px}
.back{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800}
.title-row{display:flex;align-items:center;gap:10px}
.title-row h1{font-size:1.5rem}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;font-weight:900;text-decoration:none;border:0;background:var(--sky);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.yt{background:#e62117;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--sky);outline:none}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:700}
.note{background:var(--sky-soft);border-radius:18px;padding:14px 16px;font-weight:700}

/* media */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none}
.search:focus-within{border-color:var(--sky)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:20px;border:0;background:var(--surface);box-shadow:var(--shadow);min-height:108px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{font-size:1.7rem;line-height:1}
.tile .nm{font-family:var(--display);font-weight:700;font-size:1.05rem}
.tile .ct{font-size:.82rem;font-weight:800;color:var(--muted)}
.tile.soon{opacity:.62}
.tile::after{content:"";position:absolute;inset:auto 14px 0 14px;height:4px;border-radius:4px 4px 0 0;background:var(--c,var(--gold))}
.list{display:flex;flex-direction:column;gap:10px}
.soonpic{background:linear-gradient(135deg,#2a3560,#4a3a78);color:#fff;text-align:center;font-size:1.5rem}.soonpic small{display:block;font-size:.62rem;font-weight:800;opacity:.85}.vcard{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#2a3560,#4a3a78);box-shadow:0 8px 24px rgba(0,0,0,.4);color:#fff;text-align:left;cursor:pointer}.vcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0) 55%)}.vplay{position:absolute;z-index:2;left:50%;top:44%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:var(--gold,#e3b45c);color:#3a2a00;display:grid;place-items:center;font-size:1.7rem;padding-left:5px;box-shadow:0 0 0 0 rgba(227,180,92,.7);animation:vpulse 1.8s infinite}.vcard:active .vplay{transform:translate(-50%,-50%) scale(.92)}@keyframes vpulse{70%{box-shadow:0 0 0 18px rgba(227,180,92,0)}100%{box-shadow:0 0 0 0 rgba(227,180,92,0)}}.vdur{position:absolute;z-index:2;right:12px;top:12px;background:rgba(0,0,0,.7);padding:3px 9px;border-radius:10px;font-size:.8rem;font-weight:800}.vlab{position:absolute;z-index:2;left:14px;right:14px;bottom:12px}.vlab b{display:block;font-family:var(--display);font-size:1.25rem}.vlab small{font-size:.85rem;font-weight:700;opacity:.9}.vcard.soon{display:grid;place-items:center}.vcard.soon::after{display:none}.vsoon{font-size:3.2rem;opacity:.9}.vcard.soon .vlab{text-align:center;left:0;right:0}a.door{text-decoration:none;color:inherit}.chip{padding:10px 14px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);color:inherit;font:inherit;font-weight:800;margin:4px}.door.locked{opacity:.6}.lessonbtn{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:0;border-radius:16px;padding:14px;box-shadow:var(--shadow);color:inherit;font:inherit;font-weight:700}.lessonbtn b{flex:none;min-width:2.4em;color:var(--gold)}.lessonbtn span{flex:1;min-width:0}.lessonbtn i{font-style:normal}
.row{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--sky-soft),var(--gold-soft));display:grid;place-items:center;font-size:1.6rem}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;font-size:.72rem;font-weight:800;padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.row .t{font-weight:800;line-height:1.25;min-width:0}
.row .g{font-size:.8rem;color:var(--muted);font-weight:700;margin-top:3px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:min(720px,100%);max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.close{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800}
.btns{display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:60}

/* attendance */
.here{width:100%;min-height:150px;border-radius:28px;border:0;background:linear-gradient(140deg,#3fae6a,#1f7a48);color:#fff;font-family:var(--display);font-size:1.6rem;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.here small{font-family:var(--body);font-weight:800;font-size:.95rem;opacity:.9}
.here.done{background:linear-gradient(140deg,#c99a3c,#8a5f1c)}
.codebox{letter-spacing:.5em;text-align:center;font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;padding-left:.5em!important}
.bigcode{font-size:3.6rem;font-weight:900;letter-spacing:.25em;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.hist{display:flex;flex-wrap:wrap;gap:8px}
.hist span{background:var(--gold-soft);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-weight:800}
.ok{color:var(--good);font-weight:900}

/* quiz */
.qcard{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.qprog{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.q{font-size:1.2rem;font-weight:900}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;text-align:left;font-weight:800}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.stars{font-size:2.6rem;text-align:center;letter-spacing:.1em}
.qlist .tile{min-height:96px}

/* games */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:3/4;max-width:100%;border:0;border-radius:16px;background:linear-gradient(140deg,var(--sky),#1d5f8f);color:#fff;font-size:2rem;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .25s}
.mc.open,.mc.got{background:var(--surface);color:var(--ink);transform:rotateY(180deg)}
.mc .f{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;line-height:1}
.mc .f small{font-size:.62rem;font-weight:900;margin-top:4px}
.mc.got{outline:3px solid var(--good)}
.stat{display:flex;justify-content:space-between;font-weight:900;font-variant-numeric:tabular-nums}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lt{width:48px;height:56px;border-radius:12px;border:0;background:var(--gold);color:#fff;font-size:1.5rem;font-weight:900;box-shadow:var(--shadow)}
.lt:disabled{opacity:.25}
.answer{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;border:2px dashed var(--line);border-radius:16px;padding:8px}
.answer span{width:40px;height:48px;border-radius:10px;background:var(--sky-soft);display:grid;place-items:center;font-size:1.3rem;font-weight:900}

/* bible */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bk{border:0;background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;box-shadow:var(--shadow)}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.ch{border:0;background:var(--surface);border-radius:12px;padding:12px 0;font-weight:900;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px;font-weight:900}
.seg button[aria-pressed="true"]{background:var(--gold);color:#fff}
.reader{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);font-size:var(--fs,1.08rem);line-height:1.7;max-width:70ch}
.reader sup{color:var(--gold);font-weight:900;margin-right:4px;font-size:.7em}
.navrow{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.navrow .btn{flex:1;min-width:120px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
footer{text-align:center;color:var(--muted);font-size:.85rem;font-weight:700}
.workshop{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;padding:12px 24px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.06em;color:#2b1d05;background:linear-gradient(135deg,#f6d27a,#e3b45c 50%,#b9852b);box-shadow:0 6px 18px rgba(227,180,92,.45),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .15s,box-shadow .15s}
.workshop:active{transform:scale(.96)}
.workshop::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:wshine 3.5s ease-in-out infinite}
@keyframes wshine{0%,60%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.workshop::after{animation:none}}
@media (max-width:420px){.row{grid-template-columns:112px 1fr}.door{min-height:132px}.door .big{font-size:3.8rem}}
@media (prefers-reduced-motion:reduce){*:not(#intro):not(#intro *){animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<link rel="stylesheet" href="theme.css?v=1">
<link rel="stylesheet" href="ds.css?v=1">

<div id="intro" aria-label="Intro">
  <div class="intro-logo" id="introEnd"><img id="introLogo" alt="Heavenly Visions"><p>Learn · Play · Grow in Faith</p></div>
</div>
<div class="wrap" id="app"></div>
<canvas id="confetti" hidden></canvas>
<div class="toast" id="toast" hidden></div>

<script src="builder.js?v=6"></script>
<script src="profile.js?v=11"></script>
<script src="sync.js?v=1"></script>
<script src="qr.js?v=1"></script>
<script src="live.js?v=1"></script>
<script src="theme.js?v=1"></script>
<script src="ds.js?v=1"></script>
<script src="shell.js?v=1"></script>
<script src="curriculum.js?v=1"></script>
<script src="verses.js?v=1"></script>
<script src="lessongames.js?v=1"></script>

function runIntro(){
  const intro=$("#intro"),end=$("#introEnd");$("#introLogo").src=LOGO;

function topbar(title,ic,sub,back="home"){
  return `<div class="topbar"><button class="back" data-go="${back}">← Back</button></div>
  <div class="title-row"><span style="font-size:2rem">${ic}</span><div><h1>${title}</h1>${sub?`<div class="tag">${sub}</div>`:""}</div></div>`;
}

const sec=id=>SECTIONS.find(s=>s.id===id);
const inSec=id=>V.filter(v=>v[3]===id);
function rowHTML(v,showSec){const s=sec(v[3]);
  return `<button class="row" data-v="${v[0]}"><span class="thumb">${s.ic}<img src="https://i.ytimg.com/vi/${v[0]}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><span class="dur">${v[2]}</span></span>
  <span style="min-width:0"><span class="t">${esc(v[1])}</span>${showSec?`<div class="g">${s.ic} ${s.name}</div>`:""}</span></button>`}
function media(){
  app.innerHTML=`${topbar("Sunday School","🎬",V.length+" lesson videos")}
  <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Search lessons (e.g. St. Mary, Pentecost)" autocomplete="off"></label>
  <div id="results" class="list" hidden></div>
  <section class="sec" id="grades"><h2>Choose your class</h2><div class="grid">${SECTIONS.map(s=>{const n=CUR[s.id]?CUR[s.id].reduce((a,b)=>a+b[1].length,0):inSec(s.id).length;
    return `<button class="tile ${n?"":"soon"}" style="--c:${s.c}" data-go="m-${s.id}"><span class="ic">${s.ic}</span><span class="nm">${s.name}</span><span class="ct">${n?n+(CUR[s.id]?" lesson":" video")+(n>1?"s":""):"Coming soon"}</span></button>`}).join("")}</div></section>
  <section class="sec"><h2>Newest lessons</h2><div class="list">${["BHKgrAQCs3A","gMAFxDCTzr8","ZDRMmShq1jg"].map(id=>rowHTML(V.find(v=>v[0]===id),true)).join("")}</div></section>`;
  const q=$("#q"),res=$("#results"),gr=$("#grades");
  q.addEventListener("input",()=>{const t=q.value.trim().toLowerCase();if(!t){res.hidden=true;gr.hidden=false;return}
    const m=V.filter(v=>v[1].toLowerCase().includes(t)||sec(v[3]).name.toLowerCase().includes(t));
    res.innerHTML=m.length?m.map(v=>rowHTML(v,true)).join(""):`<div class="empty">No lessons match "${esc(q.value)}"</div>`;res.hidden=false;gr.hidden=true});
}

function verseQuiz(g,n){const v=verseOf(g,n),t=v&&v[0];if(!t)return "";const id="vq-"+g+"-"+n;
  const clean=w=>w.replace(/[^A-Za-z']/g,""),words=t.split(/\s+/);
  const idx=words.map((w,i)=>i).filter(i=>clean(words[i]).length>=4);if(idx.length<2)return "";
  const pool=[...new Set(Object.values(LVERSE).flatMap(x=>(x[0]||"").split(/\s+/).map(clean)).filter(w=>w.length>=4).map(w=>w.toLowerCase()))];
  const q=idx.sort(()=>Math.random()-.5).slice(0,4).map(i=>{const ans=clean(words[i]),low=ans.toLowerCase();
    const bad=pool.filter(w=>w!==low).sort(()=>Math.random()-.5).slice(0,3);

function versePuzzle(g,n){const l=lessonOf(g,n),v=verseOf(g,n);if(!l||!v||!v[0])return lessonPage(g,n);
  const words=v[0].split(/\s+/);let pick=[];const bank=words.map((w,i)=>i).sort(()=>Math.random()-.5);

    ${fin?`<div class="card sec" style="text-align:center"><div class="stars">⭐⭐⭐</div><b>Well done! 🎉</b><div class="btns"><button class="btn gold" data-vp="again">🔁 Play again</button><button class="btn alt" data-go="l-${g}-${n}">Back to lesson</button></div></div>`
    :`<div>${left.map(i=>`<button class="chip" data-vp="${i}">${esc(words[i])}</button>`).join("")}</div><div class="btns"><button class="btn alt" data-vp="undo">↩️ Undo</button></div>`}`;
    if(fin){confetti();if(window.hvAward)hvAward("selfplay","vp-"+g+"-"+n,"Verse puzzle")}
    app.querySelectorAll("[data-vp]").forEach(b=>b.onclick=()=>{const k=b.dataset.vp;
      if(k==="again"){pick=[];bank.sort(()=>Math.random()-.5);return draw()}
      if(k==="undo"){pick.pop();return draw()}
      if(words[+k]===words[pick.length]){pick.push(+k);draw()}else toast("Not that one, try again 🙂")})}
  draw()}

    <div class="qcard"><div class="qprog"><i style="width:${i/order.length*100}%"></i></div><div class="q">${esc(x.t)}</div>
    <div class="opts">${x.o.map(o=>`<button class="opt" data-k="${o.k}">${esc(o.s)}</button>`).join("")}</div><div id="fb" role="status"></div></div>`;
    app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.k;app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.k===x.a)o.classList.add("right")});
      if(k===x.a){score++;$("#fb").innerHTML=`<p class="ok">Correct! 🎉</p>`}else{b.classList.add("wrong");$("#fb").innerHTML=`<p class="err">Not quite. The right answer is in green.</p>`}
      setTimeout(()=>{i++;i<order.length?draw():end()},1300)}))}
  function end(){const st=starsFor(score,order.length);const best=store.get("best",{});if(best[id]==null||score>best[id]){best[id]=score;store.set("best",best)}
    if(st===3)confetti();
    app.innerHTML=`${topbar(Q.name,Q.ic,"Quiz complete","quizzes")}
    <div class="qcard" style="text-align:center"><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
    <h2 style="font-size:1.6rem">${score} / ${order.length}</h2><p class="tag" style="margin:0">${st===3?"Perfect! God bless you!":st===2?"Great job!":st===1?"Good try! Watch the lesson and try again.":"Watch the lesson and try again!"}</p>
    <div class="btns"><button class="btn gold" data-go="quiz-${id}" data-again>🔁 Try again</button>${Q.v?`<button class="btn" data-v="${Q.v}">▶ Watch the lesson</button>`:""}<button class="btn alt" data-go="quizzes">All quizzes</button></div></div>`}
  draw()}

/* ================= GAMES ================= */
function games(){app.innerHTML=`${topbar("Games","🎮","Play & learn")}
  <button class="btn gold" data-go="join" style="min-height:64px;font-size:1.15rem">🎯 Enter a game code</button>
  <div class="hero-art" aria-hidden="true"><span>🎮</span><span>🃏</span><span>🔤</span><span>⭐</span></div>
  <div class="grid">
   <button class="tile" style="--c:#2f8fc0" data-go="g-memory"><span class="ic">🃏</span><span class="nm">Bible Match</span><span class="ct">Find the pairs</span></button>
   <button class="tile" style="--c:#d98a2b" data-go="g-scramble"><span class="ic">🔤</span><span class="nm">Name Scramble</span><span class="ct">Fix the Bible names</span></button>
  </div><div id="kidGames"></div><div class="note">🎮 More games coming soon!</div>`;if(window.kidGames)kidGames($("#kidGames"))}
const MEM=[["🚢","Noah's Ark"],["🦁","Daniel"],["🕊️","Holy Spirit"],["⭐","Star of Bethlehem"],["🐟","5 Loaves & 2 Fish"],["🌈","God's Promise"],["🐑","Good Shepherd"],["👑","King David"]];
function memory(){const cards=[...MEM,...MEM].map((m,i)=>({m,i,id:MEM.indexOf(m)})).sort(()=>Math.random()-.5);let open=[],got=0,moves=0,lock=false;
  app.innerHTML=`${topbar("Bible Match","🃏","Find all 8 pairs","games")}<div class="stat"><span id="mv">Moves: 0</span><span id="pr">Pairs: 0/8</span></div>
  <div class="memgrid">${cards.map((c,k)=>`<button class="mc" data-k="${k}" aria-label="Card"><span>✝️</span></button>`).join("")}</div>
  <button class="btn alt" data-go="g-memory" data-again>🔁 New game</button>`;
  app.querySelectorAll(".mc").forEach(b=>b.addEventListener("click",()=>{if(lock||b.classList.contains("open")||b.classList.contains("got"))return;
    const c=cards[+b.dataset.k];b.classList.add("open");b.innerHTML=`<span class="f">${c.m[0]}<small>${c.m[1]}</small></span>`;open.push(b);
    if(open.length===2){moves++;$("#mv").textContent="Moves: "+moves;const [a,d]=open;
      if(cards[+a.dataset.k].id===cards[+d.dataset.k].id){a.classList.add("got");d.classList.add("got");open=[];got++;$("#pr").textContent=`Pairs: ${got}/8`;if(got===8){confetti();setTimeout(()=>toast(`You won in ${moves} moves! 🎉`),400)}}
      else{lock=true;setTimeout(()=>{open.forEach(x=>{x.classList.remove("open");x.innerHTML="<span>✝️</span>"});open=[];lock=false},850)}}}))}
const WORDS=[["NOAH","Built the ark"],["MOSES","Led God's people out of Egypt"],["DAVID","Beat Goliath with a stone"],["DANIEL","Safe in the lions' den"],["JONAH","Swallowed by a big fish"],["MARY","The mother of Jesus"],["PETER","Walked on water to Jesus"],["SAMUEL","Heard God call his name at night"],["JOSEPH","Had a coat of many colors"],["GEORGE","The Prince of Martyrs"],["ABRAHAM","Father of many nations"],["ESTHER","The brave queen"]];
function scramble(){let pool=WORDS.slice().sort(()=>Math.random()-.5).slice(0,6),i=0,score=0;
  function draw(){const [w,h]=pool[i];let L=w.split("").map((c,k)=>({c,k}));do{L.sort(()=>Math.random()-.5)}while(L.map(x=>x.c).join("")===w);let picked=[];
    app.innerHTML=`${topbar("Name Scramble","🔤",`Word ${i+1} of ${pool.length} · Score ${score}`,"games")}
    <div class="qcard"><div class="q">💡 ${esc(h)}</div><div class="answer" id="ans"></div><div class="letters">${L.map((x,j)=>`<button class="lt" data-j="${j}">${x.c}</button>`).join("")}</div>
    <div class="btns" style="grid-template-columns:1fr 1fr"><button class="btn alt" id="undo">↩ Undo</button><button class="btn alt" id="skipw">Skip ›</button></div><div id="fb" role="status"></div></div>`;
    const ans=$("#ans");const show=()=>ans.innerHTML=picked.map(j=>`<span>${L[j].c}</span>`).join("");
    app.querySelectorAll(".lt").forEach(b=>b.addEventListener("click",()=>{picked.push(+b.dataset.j);b.disabled=true;show();
      if(picked.length===w.length){const guess=picked.map(j=>L[j].c).join("");
        if(guess===w){score++;$("#fb").innerHTML=`<p class="ok">Yes! ${w} 🎉</p>`;setTimeout(next,1000)}
        else{$("#fb").innerHTML=`<p class="err">Not yet. Tap Undo and try again.</p>`}}}));
    $("#undo").onclick=()=>{const j=picked.pop();if(j!=null){app.querySelector(`.lt[data-j="${j}"]`).disabled=false;show();$("#fb").textContent=""}};
    $("#skipw").onclick=()=>{$("#fb").innerHTML=`<p class="tag">It was ${w}</p>`;setTimeout(next,900)}}
  function next(){i++;i<pool.length?draw():end()}
  function end(){if(score>=5)confetti();app.innerHTML=`${topbar("Name Scramble","🔤","Game over","games")}<div class="qcard" style="text-align:center"><div class="stars">🔤</div><h2 style="font-size:1.6rem">${score} / ${pool.length}</h2><div class="btns"><button class="btn gold" data-go="g-scramble" data-again>🔁 Play again</button><button class="btn alt" data-go="games">All games</button></div></div>`}
  draw()}

/* ================= BIBLE ================= */
function bible(){const last=store.get("lastRead",null);
  app.innerHTML=`${topbar("The Bible","📖","Choose a book")}
  ${last?`<button class="btn gold" data-go="b-${encodeURIComponent(last.b)}-${last.c}">📌 Continue: ${esc(last.b)} ${last.c}</button>`:""}
  <section class="sec"><h2>Old Testament</h2><div class="books">${BOOKS.slice(0,39).map(b=>`<button class="bk" data-go="b-${encodeURIComponent(b[0])}">${b[0]}</button>`).join("")}</div></section>
  <section class="sec"><h2>New Testament</h2><div class="books">${BOOKS.slice(39).map(b=>`<button class="bk" data-go="b-${encodeURIComponent(b[0])}">${b[0]}</button>`).join("")}</div></section>`}
function bibleBook(name){const b=BOOKS.find(x=>x[0]===name);if(!b)return bible();
  app.innerHTML=`${topbar(b[0],"📖","Choose a chapter","bible")}<div class="chaps">${Array.from({length:b[1]},(_,i)=>`<button class="ch" data-go="b-${encodeURIComponent(b[0])}-${i+1}">${i+1}</button>`).join("")}</div>`}
function stopVoice(){if(window.hvAud){hvAud.pause();hvAud=null}if(window.speechSynthesis)speechSynthesis.cancel()}
async function bibleRead(name,ch){const b=BOOKS.find(x=>x[0]===name);if(!b)return bible();ch=Math.min(Math.max(1,ch),b[1]);
  const fs=store.get("fs",1.08);store.set("lastRead",{b:name,c:ch});stopVoice();
  const bi=BOOKS.indexOf(b),prev=ch>1?[name,ch-1]:bi>0?[BOOKS[bi-1][0],BOOKS[bi-1][1]]:null,next=ch<b[1]?[name,ch+1]:bi<BOOKS.length-1?[BOOKS[bi+1][0],1]:null;
  const link=(x,l)=>x?`<button class="btn alt" data-go="b-${encodeURIComponent(x[0])}-${x[1]}">${l}</button>`:"";
  
  app.innerHTML=`${topbar(`${name} ${ch}`,"📖","King James Version",`b-${encodeURIComponent(name)}`)}
  <div class="navrow"><div class="seg" role="group" aria-label="Text size"><button data-fs="-1" aria-label="Smaller text">A−</button><button data-fs="1" aria-label="Bigger text">A+</button></div></div>
  <article class="reader" id="rd" style="--fs:${fs}rem"><p class="tag">Loading…</p></article>
  <div class="navrow">${link(prev,"‹ Previous")}${link(next,"Next ›")}</div>
  <a class="btn alt" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(name+" "+ch)}&version=NKJV" target="_blank" rel="noopener">Read in NKJV ↗</a>`;
  app.querySelectorAll("[data-fs]").forEach(x=>x.onclick=()=>{let f=store.get("fs",1.08)+(+x.dataset.fs)*.1;f=Math.min(1.8,Math.max(.9,f));store.set("fs",f);$("#rd").style.setProperty("--fs",f+"rem")});
  try{const r=await fetch(`https://bible-api.com/${encodeURIComponent(name+" "+ch)}?translation=kjv`);const j=await r.json();if(!j.verses)throw 0;
    $("#rd").innerHTML=j.verses.map(v=>`<sup>${v.verse}</sup>${esc(v.text.trim())} `).join("")}
  catch{const rd=$("#rd");if(rd)rd.innerHTML=`<p class="err">Couldn't load this chapter. Check your internet, or tap "Read in NKJV".</p>`}}

/* ================= HELPERS ================= */
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200)}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#confetti"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const cols=["#e3b45c","#2f8fc0","#e86f8a","#3fae6a","#8e6bd1"];let P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vy:2+Math.random()*3,vx:(Math.random()-.5)*2,r:Math.random()*6.3,s:6+Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    t-t0<2600?requestAnimationFrame(f):(c.hidden=true)})(t0)}

/* ================= ROUTER ================= */
function route(){closeSheet();if(!(location.hash||"").startsWith("#b-"))stopVoice();const h=decodeURIComponent(location.hash.slice(1)||"home");
  if(h==="home")hub();else if(h==="media")media();else if(h.startsWith("m-"))mediaSection(h.slice(2));
  else if(h.startsWith("vp-")){const p=h.slice(3).split("-");versePuzzle(p[0],p[1])}else if(h.startsWith("lv-")){const p=h.slice(3).split("-");lessonVideos(p[0],p[1])}else if(h.startsWith("l-")){const p=h.slice(2).split("-");lessonPage(p[0],p[1])}
  else if(h==="attendance")attendance();else if(h==="attsheet")attSheet();else if(h==="servants")servants();
  else if(h==="quizzes")quizzes();else if(h.startsWith("quiz-"))quiz(h.slice(5));
  else if(h==="games")games();else if(h==="g-memory")memory();else if(h==="g-scramble")scramble();
  else if(h==="bible")bible();
  else if(h.startsWith("b-")){const m=h.slice(2).match(/^(.*?)(?:-(\d+))?$/);m[2]?bibleRead(m[1],+m[2]):bibleBook(m[1])}
  else if(!(window.builderRoute&&builderRoute(h))&&!(window.profileRoute&&profileRoute(h))&&!(window.liveRoute&&liveRoute(h))&&!(window.lgRoute&&lgRoute(h))&&!(window.shellRoute&&shellRoute(h)))hub();window.scrollTo(0,0)}
function go(h){const t="#"+h;if(location.hash===t)route();else location.hash=h}
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g){if(g.hasAttribute("data-close"))closeSheet();go(g.dataset.go);return}
  const v=e.target.closest("[data-v]");if(v)return openLesson(v.dataset.v);
  const la=e.target.closest("[data-la]");if(la)return lessonAction(la.dataset.la,la.dataset.g,la.dataset.n);
  if(e.target.closest("[data-act=lockmsg]"))return toast("Curriculum material is for servants only 🔒");
  if(e.target.closest("[data-close]"))return closeSheet();
  const a=e.target.closest("[data-act]");if(a){if(a.dataset.act==="attend")attendSheet();if(a.dataset.act==="setcode")setCodeSheet();if(a.dataset.act==="editme"){store.set("me",null);attendance()}return}
  const c=e.target.closest("[data-copy]");if(c){try{await navigator.clipboard.writeText(c.dataset.copy);toast("Link copied ✅")}catch{toast(c.dataset.copy)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
addEventListener("hashchange",route);
runIntro();route();
if(IS_LIVE){const l=document.createElement("link");l.rel="manifest";l.href="manifest.json";document.head.appendChild(l);
  const a=document.createElement("link");a.rel="apple-touch-icon";a.href="icon-180.png";document.head.appendChild(a);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
