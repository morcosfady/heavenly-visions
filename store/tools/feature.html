<!doctype html>
<html><head><meta charset="utf-8"><title>Feature graphic</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cairo:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{position:relative;background:linear-gradient(160deg,#0f1a45 0%,#2a2a72 55%,#6a3f8f 100%);color:#fff;font-family:Nunito,Cairo,sans-serif}
.rays{position:absolute;left:-10%;top:-60%;width:120%;height:200%;background:repeating-conic-gradient(from 160deg at 28% 50%,transparent 0 6deg,rgba(255,215,140,.13) 7deg 9deg,transparent 10deg 14deg);mask-image:radial-gradient(circle at 28% 50%,#000,transparent 65%)}
.glow{position:absolute;left:40px;top:40px;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,110,.55),transparent)}
img{position:absolute;left:50px;top:105px;width:400px}
.t{position:absolute;right:50px;top:150px;width:470px;text-align:left}
h1{font-family:Cinzel,serif;font-weight:800;font-size:54px;line-height:1.1;margin:0;color:#f6d27a;text-shadow:0 4px 18px rgba(0,0,0,.45)}
p{font-weight:800;font-size:27px;margin:14px 0 0;color:#eef0ff}
.stars i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.8}
body.ar .t{text-align:right}body.ar h1{font-family:Cairo,sans-serif;font-size:50px}body.ar p{font-family:Cairo,sans-serif}
</style></head>
<body>
<div class="rays"></div><div class="glow"></div><div class="stars"><i style="left:560px;top:40px"></i><i style="left:900px;top:70px"></i><i style="left:700px;top:430px"></i><i style="left:980px;top:300px"></i><i style="left:960px;top:420px"></i><i style="left:820px;top:30px"></i></div>
<img src="../../logo.png" alt="">
<div class="t"><h1 id="h"></h1><p id="p"></p></div>
<script>
const ar=new URLSearchParams(location.search).get("lang")==="ar";
if(ar){document.body.classList.add("ar");document.documentElement.dir="rtl";
 document.getElementById("h").textContent="تعلّم · العب · انمُ في الإيمان";document.getElementById("p").textContent="مدارس الأحد لكل الصفوف";
 document.querySelector(".t").style.left="50px";document.querySelector(".t").style.right="auto";document.querySelector("img").style.left="auto";document.querySelector("img").style.right="50px"}
else{document.getElementById("h").textContent="Learn · Play · Grow in Faith";document.getElementById("p").textContent="Sunday School for every grade"}
</script></body></html>
